name: release

# Tag a version (git tag v0.1.1 && git push --tags) and CI builds a
# standalone binary for every platform, then publishes a GitHub Release.
# workflow_dispatch builds the same binaries as downloadable artifacts
# WITHOUT cutting a release — used to test a build before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    asset: keeper-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: keeper-linux-aarch64 }
          - { os: windows-latest,   asset: keeper-windows-x86_64.exe }
          - { os: macos-latest,     asset: keeper-macos-aarch64 }
          - { os: macos-15-intel,   asset: keeper-macos-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyinstaller pypdf python-docx rich pillow

      - name: Build standalone binary
        shell: bash
        run: |
          pyinstaller --onefile --name keeper --paths . \
            --collect-submodules pypdf --collect-submodules docx \
            --collect-submodules PIL \
            packaging/entry.py

      - name: Build GUI binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y python3-tk
          fi
          pyinstaller --onefile --windowed --name keeper-gui --paths . \
            --collect-submodules pypdf --collect-submodules docx \
            --collect-submodules PIL \
            packaging/entry_gui.py

      - name: Name the asset
        shell: bash
        run: |
          base="${{ matrix.asset }}"
          guibase="${base/keeper-/keeper-gui-}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/keeper.exe "dist/${base}"
            cp dist/keeper-gui.exe "dist/${guibase}"
          else
            cp dist/keeper "dist/${base}"
            cp dist/keeper-gui "dist/${guibase}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/keeper-gui-*

  release:
    needs: build
    # Publish only on a version tag. A manual (workflow_dispatch) build
    # produces artifacts for testing but must not cut a release.
    # On a tag, publish whatever platforms built even if one leg failed —
    # a partial release beats no release.
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
