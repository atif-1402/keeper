<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="Keeper — which copy do I keep?">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- minimal mark: one keeper document, one check -->
  <g transform="translate(352 14)">
    <rect x="2" y="2" width="52" height="64" rx="9" fill="none" stroke="url(#kg)" stroke-width="3"/>
    <rect x="15" y="17" width="26" height="4" rx="2" fill="url(#kg)" opacity="0.55"/>
    <rect x="15" y="27" width="18" height="4" rx="2" fill="url(#kg)" opacity="0.35"/>
    <circle cx="48" cy="58" r="12" fill="#3fb950"/>
    <path d="M42.5 58 l4 4.5 l7.5 -8.5" stroke="#0d1117" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="380" y="140" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#kg)">Keeper</text>
  <text x="380" y="172" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e">which copy do I keep?</text>
</svg>
