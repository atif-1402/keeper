[project]
name = "keeper-ai"
version = "0.2.0"
description = "Keeper — finds version-clone files in a folder and tells you which one to keep. 100% offline, powered by an open-weight model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rich>=13.7",
    "pillow>=10.0",
]

[project.scripts]
keeper = "keeper.cli:main"
keeper-gui = "keeper.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keeper"]
